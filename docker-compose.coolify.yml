version: '3.8'

services:
  # ============ BANCO DE DADOS ============
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-portaldcp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PortalDCP2026!Secure}
      POSTGRES_DB: ${DB_DATABASE:-portaldcp}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portaldcp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portaldcp} -d ${DB_DATABASE:-portaldcp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ REDIS (CACHE/SESSÕES) ============
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - portaldcp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ BACKEND (API NESTJS) ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FONTE_PRECOS_BASE_URL: ${FONTE_PRECOS_BASE_URL:-}
      FONTE_PRECOS_EMAIL: ${FONTE_PRECOS_EMAIL:-}
      FONTE_PRECOS_PASSWORD: ${FONTE_PRECOS_PASSWORD:-}
      FONTE_PRECOS_PERIODO_DIAS: ${FONTE_PRECOS_PERIODO_DIAS:-365}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-portaldcp}
      DB_PASSWORD: ${DB_PASSWORD:-PortalDCP2026!Secure}
      DB_DATABASE: ${DB_DATABASE:-portaldcp}
      JWT_SECRET: ${JWT_SECRET:-PortalDCP2026JWTSecretKeyMuitoSegura!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PNCP_API_URL: ${PNCP_API_URL:-https://treina.pncp.gov.br/api/pncp/v1}
      PNCP_LOGIN: ${PNCP_LOGIN:-}
      PNCP_SENHA: ${PNCP_SENHA:-}
      PNCP_CNPJ_ORGAO: ${PNCP_CNPJ_ORGAO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-52428800}
      UPLOAD_DEST: /app/uploads
      UPLOAD_DIR: /app/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: America/Sao_Paulo
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - portaldcp-net

  # ============ FRONTEND (NEXTJS) ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - portaldcp-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  portaldcp-net:
    driver: bridge
