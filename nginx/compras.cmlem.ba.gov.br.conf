server {
    listen 80;
    listen [::]:80;
    server_name compras.cmlem.ba.gov.br;

    # Redireciona HTTP para HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name compras.cmlem.ba.gov.br;

    # SSL - Certbot vai gerenciar esses certificados
    ssl_certificate /etc/letsencrypt/live/compras.cmlem.ba.gov.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compras.cmlem.ba.gov.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/compras.cmlem.ba.gov.br.access.log;
    error_log /var/log/nginx/compras.cmlem.ba.gov.br.error.log;

    # Tamanho máximo de upload (50MB para PDFs de contrato)
    client_max_body_size 50M;

    # Timeout aumentado para operações de IA
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Frontend (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (NestJS)
    location /api/ {
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout maior para endpoints de IA
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
