name: Deploy to VPS Hostinger

# Produção da Câmara: SÓ o branch `producao` e SÓ quando o dono mandar.
# Antes este workflow rodava a cada push no `main` e fazia `git pull origin main`
# na VPS — só não subia porque o segredo VPS_SSH_KEY estava vazio. Configurar a
# chave levaria todo merge do `main` (homologação) direto para a Câmara, que é
# exatamente o que a regra do `producao` proíbe (CLAUDE.md; incidente de
# 04/10/2026). Agora: disparo manual, branch fixo e confirmação digitada.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PRODUCAO para confirmar o deploy do branch producao na VPS da Câmara'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/producao' && github.event.inputs.confirmacao == 'PRODUCAO'

    steps:
      - name: Deploy via SSH (deploy-vps.sh — mostra o que vai junto antes de subir)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 72.60.4.218
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/portaldcp
            BRANCH=producao bash deploy-vps.sh
